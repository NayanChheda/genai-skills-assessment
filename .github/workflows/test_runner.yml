name: Test Local Runner

on:
  workflow_dispatch:  # Manual trigger

jobs:
  test-runner:
    runs-on: self-hosted
    
    steps:
    - name: Check Python
      run: |
        python --version
        pip --version
    
    - name: Check Git
      run: |
        git --version
    
    - name: Check Directory
      run: |
        pwd
        ls -la